version: 2.1

# Add Snyk orb at the top
orbs:
  snyk: snyk/snyk@2.0.2  # Replace with latest version

jobs:
  build:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: docker build -t my-vite-app .
      - run:
          name: Save Docker image to workspace
          command: docker save my-vite-app -o my-vite-app.tar
      - persist_to_workspace:
          root: .
          paths:
            - my-vite-app.tar

  test:
    docker:
      - image: cimg/node:18.20
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Run Vitest
          command: npm test -- --run

  # Add new security scan job
  security-scan:
    docker:
      - image: cimg/node:18.20
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - snyk/scan:
          fail-on-issues: false  # Set to true to fail build on vulnerabilities
          monitor-on-build: true
          token-variable: SNYK_TOKEN_INDY

  publish:
    docker:
      - image: cimg/base:stable
    steps:
      - setup_remote_docker
      - attach_workspace:
          at: .
      - run:
          name: Load Docker image
          command: docker load -i my-vite-app.tar
      - run:
          name: Push Docker image to DockerHub
          command: |
            echo "$DOCKERHUB_PW_INDY" | docker login -u "$DOCKERHUB_INDY" --password-stdin
            docker tag my-vite-app $DOCKERHUB_INDY/fridge_rescue_devops:v.1.0.1
            docker push $DOCKERHUB_INDY/fridge_rescue_devops:v.1.0.1

  deploy:
    docker:
      - image: cimg/node:18.20
    steps:
      - checkout
      - run:
          name: Install Vercel CLI locally
          command: npm install --save-dev vercel
      - run:
          name: Disable telemetry
          command: export VERCEL_TELEMETRY=0
      - run:
          name: Deploy to Vercel (headless)
          command: npx vercel ./dist --prod --confirm --token $$VERCEL_TOKEN_INDY --scope$$ VERCEL_ORG_INDY

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build
      - test:
          requires:
            - build
      - security-scan:  # Add security scan job
          requires:
            - build
      - publish:
          requires:
            - test
            - security-scan  # Require security scan to pass
      - deploy:
          requires:
            - test
            - publish
            - security-scan  # Ensure security scan passes before deploy
          filters:
            branches:
              only: release
