version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:18.20
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Build Vite app
          command: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - dist
            - package.json
            - package-lock.json
            - node_modules

  test:
    docker:
      - image: cimg/node:18.20
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Run Vitest
          command: npm test -- --run

  publish:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: docker build -t my-vite-app .
      - run:
          name: Push Docker image to DockerHub
          command: |
            echo "$DOCKERHUB_PW_RAHMAT" | docker login -u "$DOCKERHUB_RAHMAT" --password-stdin
            docker tag my-vite-app $DOCKERHUB_RAHMAT/fridge_rescue_devops:latest
            docker push $DOCKERHUB_RAHMAT/fridge_rescue_devops:latest

  deploy:
    docker:
      - image: cimg/node:18.20
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install Vercel CLI locally
          command: npm install --save-dev vercel
      - run:
          name: Disable telemetry
          command: export VERCEL_TELEMETRY=0
      - run:
          name: Deploy to Vercel
          command: npx vercel ./dist --prod --confirm --token $VERCEL_TOKEN_RAHMAT --scope $VERCEL_ORG_RAHMAT

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build
      - test:
          requires:
            - build
      - publish:
          requires:
            - test
      - deploy:
          requires:
            - test
            - publish
          filters:
            branches:
              only: release
