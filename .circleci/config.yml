version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:18.20
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      # - run:
      #     name: Run tests
      #     command: npm test
      - run:
          name: Build Vite app
          command: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - dist
            - package.json
            - package-lock.json
            - node_modules

  # deploy:
  #   docker:
  #     - image: cimg/node:18.20
  #   steps:
  #     - checkout
  #     - attach_workspace:
  #         at: .

  #       # Install dependencies
  #     - run:
  #         name: Install dependencies
  #         command: npm install

  #       # Build Vite app
  #     - run:
  #         name: Build app
  #         command: npm run build

  #       # Install Vercel CLI
  #     - run:
  #         name: Install Vercel CLI
  #         command: npm install -g vercel

  #     - run:
  #         name: Deploy to Vercel
  #         command: vercel --prod --confirm --token jGCe49zfwxKCWUcIGFDgeyJ4 --scope team_ZlmHAV7mELGxNF1zu3LNFURd

  deploy:
    docker:
      - image: cimg/node:18.20
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install Vercel CLI locally
          command: npm install --save-dev vercel
      - run:
          name: Disable telemetry
          command: export VERCEL_TELEMETRY=0
      - run:
          name: Deploy to Vercel (headless)
          command: vercel --prod --confirm --token jGCe49zfwxKCWUcIGFDgeyJ4 --scope team_ZlmHAV7mELGxNF1zu3LNFURd

          # command: npx vercel deploy --prod --confirm \
