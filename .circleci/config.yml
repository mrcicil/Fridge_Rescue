version: 2.1

orbs:
  node: circleci/node@5.0.1
  docker: circleci/docker@2.1.4
  snyk: snyk/snyk@1.5.0

jobs:
  build:
    docker:
      - image: cimg/node:18.20
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Build Vite app
          command: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - dist
            - package.json
            - package-lock.json
            - node_modules

  test:
    docker:
      - image: cimg/node:18.20
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Run Vitest
          command: npm test -- --run
      
      
  scan:
    snyk:
      # Run Snyk scan
      - snyk/scan:
          severity-threshold: high  # Only fail on high-severity issues (optional: low, medium, high, critical)
          fail-on-issues: true     # Fail the build if vulnerabilities are found
          #monitor: true            # Upload results to Snyk for monitoring
          #project: "${CIRCLE_PROJECT_REPONAME}/${CIRCLE_BRANCH}"  # Optional: specify project name
          token-variable: SNYK_TOKEN  # Use the environment variable for the Snyk token


  publish:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: docker build -t my-vite-app .
      - run:
          name: Push Docker image to DockerHub
          command: |
            echo "$DOCKERHUB_PW_INDY" | docker login -u "$DOCKERHUB_INDY" --password-stdin
            docker tag my-vite-app $DOCKERHUB_INDY/fridge_rescue_devops:prod.v.1.0.2
            docker push $DOCKERHUB_INDY/fridge_rescue_devops:prod.v.1.0.2

  deploy:
    docker:
      - image: cimg/node:18.20
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install Vercel CLI locally
          command: npm install --save-dev vercel
      - run:
          name: Disable telemetry
          command: export VERCEL_TELEMETRY=0
      - run:
          name: Deploy to Vercel
          command: npx vercel ./dist --prod --confirm --token $VERCEL_TOKEN_INDY --scope $VERCEL_ORG_INDY

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build
      - test:
          requires:
            - build
      - publish:
          requires:
            - test
      - deploy:
          requires:
            - test
            - publish
          filters:
            branches:
              only: release