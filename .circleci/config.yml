version: 2.1

orbs:
  node: circleci/node@5.0.1
  docker: circleci/docker@2.1.4
  snyk: snyk/snyk@1.5.0

jobs:
  deploy:
    docker:
      - image: cimg/node:18.20
    steps:
      - checkout

      # Install dependencies
      - run:
          name: Install dependencies
          command: npm install

      # Run Snyk scan
      - snyk/scan:
          severity-threshold: high  # Only fail on high-severity issues (optional: low, medium, high, critical)
          fail-on-issues: true     # Fail the build if vulnerabilities are found
          #monitor: true            # Upload results to Snyk for monitoring
          project: "${CIRCLE_PROJECT_REPONAME}/${CIRCLE_BRANCH}"  # Optional: specify project name
          token-variable: SNYK_TOKEN  # Use the environment variable for the Snyk token

      # Build Vite app
      - run:
          name: Build app
          command: npm run build

      # Install Vercel CLI
      - run:
          name: Install Vercel CLI
          command: npm install -g vercel

      - run:
          name: Debug Environment
          command: |
            echo "Current branch: $CIRCLE_BRANCH"

      # Deploy to Vercel
      - run:
          name: Deploy to Vercel
          command: |
            if [ "$CIRCLE_BRANCH" = "bahbah" ]; then
              vercel --prod --confirm --token YVYGnFyAtgB9fzdIsYyIdDDa --scope team_BNsySplYwrgHiBExEISTEAaZ
            else
              echo "Skipping deployment: not on bahbah branch (current branch: $CIRCLE_BRANCH)"
            fi

workflows:
  version: 2
  build-deploy:
    jobs:
      - deploy