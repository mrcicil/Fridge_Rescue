version: 2.1

jobs:
  deploy:
    docker:
      - image: cimg/node:18.20
    steps:
      - checkout

      # Install dependencies
      - run:
          name: Install dependencies
          command: npm install

      # Build Vite app
      - run:
          name: Build app
          command: npm run build

      # Install Vercel CLI
      - run:
          name: Install Vercel CLI
          command: npm install -g vercel

      # - run:
      #     name: Deploy to Vercel
